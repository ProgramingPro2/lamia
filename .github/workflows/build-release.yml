name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose wheels to publish to PyPI
        required: true
        default: v1.8.0
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            wheel-platform: macosx_11_0_arm64
          - os: macos-15-intel
            target: macos-x86_64
            wheel-platform: macosx_11_0_x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
            wheel-platform: manylinux_2_17_x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
            wheel-platform: manylinux_2_17_aarch64
          - os: windows-latest
            target: windows-x86_64
            wheel-platform: win_amd64

    timeout-minutes: 45
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: '1.24.x'
          check-latest: true
          cache: false

      - name: Build
        shell: bash
        env:
          LAMIA_WHEEL_PLATFORM_TAG: ${{ matrix.wheel-platform }}
        run: |
          uv sync --frozen
          uv build --wheel
          uv run python -c 'import glob, os, sys, zipfile; wheels = glob.glob("dist/*.whl"); assert len(wheels) == 1, wheels; archive = zipfile.ZipFile(wheels[0]); tui = "lamia/bin/lamia-tui.exe" if sys.platform == "win32" else "lamia/bin/lamia-tui"; assert tui in archive.namelist(); metadata = archive.read(next(name for name in archive.namelist() if name.endswith(".dist-info/WHEEL"))).decode(); assert "Root-Is-Purelib: false" in metadata; assert "Tag: py3-none-" + os.environ["LAMIA_WHEEL_PLATFORM_TAG"] in metadata'

          uv run pyinstaller lamia.spec --noconfirm

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            PYI_BINARY="dist/lamia.exe"
            TUI_NAME="lamia-tui.exe"
            dist/lamia.exe --version
          else
            PYI_BINARY="dist/lamia"
            TUI_NAME="lamia-tui"
            dist/lamia --version
          fi
          uv run pyi-archive_viewer -l -r "$PYI_BINARY" > archive.txt
          grep -E "lamia[/\\]+bin[/\\]+$TUI_NAME" archive.txt >/dev/null
          grep -E "'google\.auth\.transport\.requests'" archive.txt >/dev/null
          grep -E "'boto3\.session'" archive.txt >/dev/null

          if [[ "${{ matrix.target }}" == "linux-arm64" ]]; then
            file dist/lamia
            file dist/lamia | grep -q "ARM aarch64" || {
              echo "::error::linux-arm64 artifact is not an ARM aarch64 binary"
              exit 1
            }
          fi

          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          mkdir -p dist/release

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp dist/lamia.exe "dist/release/lamia-${VERSION}-${{ matrix.target }}.exe"
            (cd dist/release && 7z a "lamia-${VERSION}-${{ matrix.target }}.zip" "lamia-${VERSION}-${{ matrix.target }}.exe")
          else
            cp dist/lamia "dist/release/lamia-${VERSION}-${{ matrix.target }}"
            chmod +x "dist/release/lamia-${VERSION}-${{ matrix.target }}"
            tar -C dist/release -czvf "dist/release/lamia-${VERSION}-${{ matrix.target }}.tar.gz" "lamia-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lamia-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/*.whl
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: release/**

      - name: Collect wheels for PyPI
        run: |
          mkdir -p dist
          find release -type f -name '*.whl' -exec cp -t dist {} +
          find dist -type f -name '*.whl' -print
          test -n "$(find dist -type f -name '*.whl' -print -quit)"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Publish wheels to PyPI
        run: uv publish --trusted-publishing always dist/*.whl

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern '*.whl' --dir dist
          find dist -type f -name '*.whl' -print
          test -n "$(find dist -type f -name '*.whl' -print -quit)"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Publish wheels to PyPI
        run: uv publish --trusted-publishing always dist/*.whl
